document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

splay = on ? \"block\" : \"none\";\n    ov.scrollTop = 0;\n    document.documentElement.style.overflow = on ? \"hidden\" : \"\";\n    if (btn) btn.textContent = on ? \"▣ ARCHITECT MODE\" : \"▤ EXECUTIVE MODE\";\n  }\n\n  /* ---------- live terminal ---------- */\n  termPrint(html, prompt) {\n    const o = this.termOutRef;\n    const d = document.createElement(\"div\");\n    d.style.marginBottom = \"4px\";\n    d.innerHTML = prompt ? `<span style=\"color:var(--green)\">rituraj@cmd:~$<\u002Fspan> <span style=\"color:#fff\">${html}<\u002Fspan>` : html;\n    o.appendChild(d); o.scrollTop = o.scrollHeight;\n  }\n  runCmd(raw) {\n    const cmd = raw.trim().toLowerCase();\n    const G = \"color:var(--green)\", B = \"color:var(--blue)\", P = \"color:#c4b5fd\", M = \"color:#9ca3af\";\n    const map = {\n      help: `<div style=\"${M}\">AVAILABLE COMMANDS:<\u002Fdiv><div><span style=\"${G}\">about<\u002Fspan> · <span style=\"${G}\">skills<\u002Fspan> · <span style=\"${G}\">experience<\u002Fspan> · <span style=\"${G}\">projects<\u002Fspan> · <span style=\"${G}\">architecture<\u002Fspan> · <span style=\"${G}\">ai<\u002Fspan> · <span style=\"${G}\">cloud<\u002Fspan> · <span style=\"${G}\">leadership<\u002Fspan> · <span style=\"${G}\">case-studies<\u002Fspan> · <span style=\"${G}\">resume<\u002Fspan> · <span style=\"${G}\">contact<\u002Fspan> · <span style=\"${G}\">clear<\u002Fspan><\u002Fdiv>`,\n      about: `<div style=\"${B}\">RITURAJ SINGH RATAN<\u002Fdiv><div>Technical Architect · Full Stack Engineer · AI Builder · 15+ yrs.<\u002Fdiv><div style=\"${M}\">Designs scalable systems, builds AI products, leads engineering teams.<\u002Fdiv>`,\n      skills: `<div style=\"${B}\">CAPABILITY GALAXY<\u002Fdiv>` + this.galaxy.map(g => `<div><span style=\"${G}\">${g.key}:<\u002Fspan> ${g.items.join(\", \")}<\u002Fdiv>`).join(\"\"),\n      experience: `<div style=\"${B}\">MISSION HISTORY<\u002Fdiv>` + this.career.map(c => `<div><span style=\"${G}\">${c.year}<\u002Fspan> — ${c.co} · ${c.role}<\u002Fdiv>`).join(\"\"),\n      projects: `<div style=\"${B}\">PRODUCT INTELLIGENCE<\u002Fdiv>` + this.products.map(p => `<div><span style=\"${G}\">${p.name}<\u002Fspan> — ${p.desc}<\u002Fdiv>`).join(\"\"),\n      architecture: `<div style=\"${B}\">ARCHITECTURE COMMAND CENTER<\u002Fdiv>` + this.arch.map(a => `<div><span style=\"${G}\">▸<\u002Fspan> ${a.t}<\u002Fdiv>`).join(\"\"),\n      ai: `<div style=\"${P}\">AI RESEARCH LAB<\u002Fdiv>` + this.ai.map(a => `<div><span style=\"${G}\">▸<\u002Fspan> ${a.t} — <span style=\"${M}\">${a.impact}<\u002Fspan><\u002Fdiv>`).join(\"\"),\n      cloud: `<div style=\"${B}\">CLOUD TOPOLOGY<\u002Fdiv><div>${this.topoNodes.map(n => n.label).join(\" · \")}<\u002Fdiv><div style=\"${M}\">AWS-native, event-driven, observable infrastructure.<\u002Fdiv>`,\n      leadership: `<div style=\"${B}\">ENGINEERING LEADERSHIP<\u002Fdiv><div>7+ years leading on/off-shore teams · 100+ engineers mentored<\u002Fdiv><div style=\"${M}\">Architecture governance, stakeholder liaison, delivery ownership.<\u002Fdiv>`,\n      \"case-studies\": `<div style=\"${B}\">CASE STUDY CENTER<\u002Fdiv>` + this.cases.map(c => `<div><span style=\"${G}\">${c.name}<\u002Fspan> — <span style=\"${M}\">${c.outcome}<\u002Fspan><\u002Fdiv>`).join(\"\"),\n      resume: `<div>Downloading resume... <a href=\"Rituraj-Singh-Ratan-Resume.pdf\" download style=\"${G}\">Rituraj-Singh-Ratan-Resume.pdf ↓<\u002Fa><\u002Fdiv>`,\n      contact: `<div><span style=\"${G}\">email<\u002Fspan> riturajratan@gmail.com<\u002Fdiv><div><span style=\"${G}\">linkedin<\u002Fspan> linkedin.com/in/riturajratan<\u002Fdiv><div><span style=\"${G}\">github<\u002Fspan> github.com/riturajratan<\u002Fdiv><div><span style=\"${G}\">phone<\u002Fspan> +91 98870 30945<\u002Fdiv>`,\n      whoami: `<div style=\"${G}\">elite_technical_architect<\u002Fdiv>`,\n      ls: `<div style=\"${M}\">about.md  skills/  missions.log  architecture/  ai-lab/  cloud.map  case-studies/  resume.pdf<\u002Fdiv>`,\n    };\n    if (cmd === \"clear\") { this.termOutRef.innerHTML = \"\"; return; }\n    if (cmd === \"executive\" || cmd === \"exec\") { this.toggleExec(true); this.termPrint(`<span style=\"${G}\">launching executive resume mode...<\u002Fspan>`, false); return; }\n    if (map[cmd]) this.termPrint(map[cmd], false);\n    else if (cmd === \"\") {}\n    else this.termPrint(`<span style=\"color:#ff6b6b\">command not found: ${raw}<\u002Fspan> — type <span style=\"${G}\">help<\u002Fspan>`, false);\n  }\n  initTerminal() {\n    const inp = this.termInRef; if (!inp) return;\n    this.termPrint(`<span style=\"color:var(--green)\">Welcome to RR-CMD-CENTER v4.0 — Enterprise Architect OS<\u002Fspan>`, false);\n    this.termPrint(`<span style=\"color:#9ca3af\">Type <span style=\"color:var(--green)\">help<\u002Fspan> to list commands.<\u002Fspan>`, false);\n    this._hist = []; this._hi = -1;\n    inp.addEventListener(\"keydown\", (e) => {\n      if (e.key === \"Enter\") {\n        const v = inp.value;\n        this.termPrint(v || \" \", true);\n        if (v.trim()) { this._hist.push(v); this._hi = this._hist.length; }\n        this.runCmd(v); inp.value = \"\";\n      } else if (e.key === \"ArrowUp\") { if (this._hi > 0) { this._hi--; inp.value = this._hist[this._hi] || \"\"; } e.preventDefault(); }\n      else if (e.key === \"ArrowDown\") { if (this._hi < this._hist.length - 1) { this._hi++; inp.value = this._hist[this._hi] || \"\"; } else { this._hi = this._hist.length; inp.value = \"\"; } e.preventDefault(); }\n    });\n  }\n\n  componentDidMount() {\n    this.initMatrix();\n    this.initNet();\n    this.initTopology();\n    this.bootSeq();\n    this.typeLoop();\n    this.buildMetrics();\n    this.buildGalaxy();\n    this.buildCareer();\n    this.buildArch();\n    this.buildAI();\n    this.buildProducts();\n    this.buildCases();\n    this.buildBlog();\n    this.buildExec();\n    this.initTerminal();\n\n    if (this.execBtnRef) this.execBtnRef.addEventListener(\"click\", () => this.toggleExec(!this._exec));\n\n    // glitch layers on hero h1\n    if (this.glitchRef) {\n      const mk = (anim) => { const s = this.glitchRef.cloneNode(true); s.removeAttribute(\"ref\"); s.style.position = \"absolute\"; s.style.inset = \"0\"; s.style.margin = \"0\"; s.style.pointerEvents = \"none\"; s.style.textShadow = \"none\"; s.style.animation = anim; return s; };\n      const top = mk(\"glitchTop 3.2s infinite linear\"); top.style.color = \"var(--blue)\"; top.style.left = \"2px\";\n      const bot = mk(\"glitchBot 2.7s infinite linear\"); bot.style.color = \"var(--purple)\"; bot.style.left = \"-2px\";\n      this.glitchRef.parentNode.style.position = \"relative\";\n      this.glitchRef.appendChild(top); this.glitchRef.appendChild(bot);\n    }\n\n    // counters\n    this._io = new IntersectionObserver((ents) => {\n      ents.forEach(en => { if (en.isIntersecting) { en.target.querySelectorAll(\"[data-count]\").forEach(c => { if (!c._done) { c._done = true; this.animateCount(c); } }); } });\n    }, { threshold: 0.3 });\n    document.querySelectorAll(\"section, [data-screen-label]\").forEach(s => this._io.observe(s));\n\n    // nav active\n    const links = {}; document.querySelectorAll(\"[data-navlink]\").forEach(l => links[l.getAttribute(\"href\").slice(1)] = l);\n    this._navIo = new IntersectionObserver((ents) => {\n      ents.forEach(e => { if (e.isIntersecting) { Object.values(links).forEach(l => { l.style.color = \"var(--muted)\"; l.style.background = \"transparent\"; }); const a = links[e.target.id]; if (a) { a.style.color = \"var(--green)\"; a.style.background = \"rgba(0,255,136,0.08)\"; } } });\n    }, { rootMargin: \"-45% 0px -50% 0px\" });\n    [\"about\", \"skills\", \"missions\", \"arch\", \"ai\", \"cloud\", \"terminal\"].forEach(id => { const s = document.getElementById(id); if (s) this._navIo.observe(s); });\n\n    // magnetic\n    document.querySelectorAll(\"[data-mag]\").forEach(el => {\n      el.style.transition = \"transform .25s cubic-bezier(.2,.8,.2,1)\";\n      el.addEventListener(\"mousemove\", (ev) => { const r = el.getBoundingClientRect(); el.style.transform = `translate(${(ev.clientX - (r.left + r.width / 2)) * 0.22}px,${(ev.clientY - (r.top + r.height / 2)) * 0.3}px)`; });\n      el.addEventListener(\"mouseleave\", () => { el.style.transform = \"translate(0,0)\"; });\n    });\n    // recognition cards\n    document.querySelectorAll(\"[data-card]\").forEach(c => {\n      c.addEventListener(\"mouseenter\", () => { c.style.borderColor = \"rgba(0,255,136,0.5)\"; c.style.background = \"rgba(0,255,136,0.03)\"; });\n      c.addEventListener(\"mouseleave\", () => { c.style.borderColor = \"var(--line)\"; c.style.background = \"transparent\"; });\n    });\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this._mRaf); cancelAnimationFrame(this._nRaf); cancelAnimationFrame(this._tRaf);\n    removeEventListener(\"resize\", this._mResize); removeEventListener(\"resize\", this._nResize); removeEventListener(\"resize\", this._tResize);\n    removeEventListener(\"mousemove\", this._nMove);\n    clearTimeout(this._typeT);\n    document.documentElement.style.overflow = \"\";\n    if (this._io) this._io.disconnect(); if (this._navIo) this._navIo.disconnect();\n  }\n\n  renderVals() {\n    return {\n      rootRef:(el)=>{this.rootRef=el;}, matrixRef:(el)=>{this.matrixRef=el;}, netRef:(el)=>{this.netRef=el;}, topoRef:(el)=>{this.topoRef=el;},\n      bootRef:(el)=>{this.bootRef=el;}, bootBodyRef:(el)=>{this.bootBodyRef=el;},\n      glitchRef:(el)=>{this.glitchRef=el;}, typeRef:(el)=>{this.typeRef=el;},\n      metricsRef:(el)=>{this.metricsRef=el;}, galaxyRef:(el)=>{this.galaxyRef=el;}, galaxyPanelRef:(el)=>{this.galaxyPanelRef=el;},\n      careerRef:(el)=>{this.careerRef=el;}, archRef:(el)=>{this.archRef=el;}, aiRef:(el)=>{this.aiRef=el;},\n      productsRef:(el)=>{this.productsRef=el;}, casesRef:(el)=>{this.casesRef=el;}, blogRef:(el)=>{this.blogRef=el;},\n      termOutRef:(el)=>{this.termOutRef=el;}, termInRef:(el)=>{this.termInRef=el;},\n      execRef:(el)=>{this.execRef=el;}, execBtnRef:(el)=>{this.execBtnRef=el;},\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
